<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aquarium Eye Tracking 3D Box</title>

	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/MTLLoader.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/OBJLoader.js"></script>

	<style>
		body {
			margin: 0;
			padding: 0;
			background: radial-gradient(circle at top, #09304f 0%, #02050c 70%);
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
			font-family: 'Helvetica Neue', Arial, sans-serif;
			color: #eef8ff;
		}

		#canvas-container {
			position: relative;
			width: 580px;
			height: 580px;
			border: 5px solid rgba(255, 255, 255, 0.18);
			border-radius: 26px;
			background: rgba(4, 18, 42, 0.95);
			box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
			overflow: hidden;
		}

		canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		#webcam {
			position: absolute;
			top: 18px;
			left: 18px;
			width: 120px;
			height: 90px;
			border-radius: 10px;
			transform: scaleX(-1);
			border: 2px solid rgba(255, 255, 255, 0.18);
			background: #000;
			z-index: 10;
		}

		#status {
			position: absolute;
			bottom: 18px;
			left: 50%;
			transform: translateX(-50%);
			padding: 10px 18px;
			border-radius: 999px;
			background: rgba(2, 20, 42, 0.9);
			font-size: 14px;
			letter-spacing: 0.5px;
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
			z-index: 10;
		}
	</style>
</head>

<body>

	<video id="webcam" autoplay playsinline muted></video>

	<div id="canvas-container"></div>

	<div id="status">カメラの起動を待っています...</div>

	<script>
		const videoElement = document.getElementById('webcam');
		const statusElement = document.getElementById('status');
		const container = document.getElementById('canvas-container');

		const scene = new THREE.Scene();
		scene.fog = new THREE.FogExp2(0x021122, 0.08);

		const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
		renderer.setSize(580, 580);
		renderer.setClearColor(0x021122, 1);
		container.appendChild(renderer.domElement);

		const roomSize = 10;
		const roomMaterials = [
			new THREE.MeshPhongMaterial({ color: 0x0a3c61, side: THREE.BackSide, transparent: true, opacity: 0.78 }),
			new THREE.MeshPhongMaterial({ color: 0x0b4e72, side: THREE.BackSide, transparent: true, opacity: 0.78 }),
			new THREE.MeshPhongMaterial({ color: 0x0b4567, side: THREE.BackSide, transparent: true, opacity: 0.78 }),
			new THREE.MeshPhongMaterial({ color: 0x0c4e74, side: THREE.BackSide, transparent: true, opacity: 0.78 }),
			new THREE.MeshPhongMaterial({ color: 0x0b2f50, side: THREE.BackSide, transparent: true, opacity: 0.78 }),
			new THREE.MeshPhongMaterial({ color: 0x000000, side: THREE.BackSide, transparent: true, opacity: 0 })
		];
		const room = new THREE.Mesh(new THREE.BoxGeometry(roomSize, roomSize, roomSize), roomMaterials);
		scene.add(room);

		const floor = new THREE.Mesh(
			new THREE.PlaneGeometry(roomSize - 0.4, roomSize - 0.4),
			new THREE.MeshStandardMaterial({ color: 0x755535, roughness: 0.9, metalness: 0.05 })
		);
		floor.rotation.x = -Math.PI / 2;
		floor.position.y = -roomSize / 2 + 0.08;
		scene.add(floor);

		const seaweedGroup = new THREE.Group();
		for (let i = 0; i < 12; i++) {
			const height = 1.8 + Math.random() * 1.4;
			const sw = new THREE.Mesh(
				new THREE.CylinderGeometry(0.04, 0.08, height, 8, 1, true),
				new THREE.MeshStandardMaterial({ color: 0x2ea276, emissive: 0x0b3a25, roughness: 0.75, side: THREE.DoubleSide })
			);
			sw.position.set((Math.random() - 0.5) * 5.2, -roomSize / 2 + height / 2 + 0.1, -1 - Math.random() * 2.6);
			sw.rotation.z = (Math.random() - 0.5) * 0.48;
			seaweedGroup.add(sw);
		}
		scene.add(seaweedGroup);

		const rock = new THREE.Mesh(
			new THREE.DodecahedronGeometry(0.9, 0),
			new THREE.MeshStandardMaterial({ color: 0x3b6b84, roughness: 0.75, metalness: 0.08 })
		);
		rock.position.set(0, -3.9, -2.2);
		scene.add(rock);

		const bubbles = [];
		function createBubble() {
			const mesh = new THREE.Mesh(
				new THREE.SphereGeometry(0.08 + Math.random() * 0.08, 16, 16),
				new THREE.MeshPhongMaterial({ color: 0xd8f2ff, transparent: true, opacity: 0.34, shininess: 80 })
			);
			mesh.position.set((Math.random() - 0.5) * 5.4, -roomSize / 2 + Math.random() * 4.4 + 0.3, (Math.random() - 0.5) * 4.6);
			scene.add(mesh);
			bubbles.push({ mesh, speed: 0.008 + Math.random() * 0.02 });
		}
		for (let i = 0; i < 20; i++) createBubble();

		const fishGroup = [];
		let fishModelPrototype = null;
		const fishModelPath = 'assets/model/fish/';
		const fishModelScale = 0.035;

		function createFish() {
			if (!fishModelPrototype) {
				return;
			}

			const fish = fishModelPrototype.clone(true);
			fish.scale.setScalar(fishModelScale);
			fish.position.set((Math.random() - 0.5) * 4.6, (Math.random() - 0.5) * 3.4, -1 - Math.random() * 3.4);
			fish.rotation.y = Math.random() * Math.PI * 2;
			fish.userData.velocity = new THREE.Vector3((Math.random() * 0.03 + 0.008) * (Math.random() > 0.5 ? 1 : -1), (Math.random() * 0.02 - 0.01), (Math.random() * 0.018 - 0.009));
			fishGroup.push(fish);
			scene.add(fish);
		}

		function createFallbackFish(count = 9) {
			for (let i = 0; i < count; i++) {
				const fish = new THREE.Group();
				const body = new THREE.Mesh(
					new THREE.SphereGeometry(0.22 + Math.random() * 0.12, 16, 16),
					new THREE.MeshStandardMaterial({
						color: 0xff7f50,
						roughness: 0.3,
						metalness: 0.4,
						emissive: 0x111111,
					})
				);
				const tail = new THREE.Mesh(
					new THREE.ConeGeometry(0.16, 0.34, 10),
					new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.2 })
				);
				tail.position.set(-0.37, 0, 0);
				tail.rotation.z = Math.PI;
				fish.add(body, tail);

				fish.position.set((Math.random() - 0.5) * 4.6, (Math.random() - 0.5) * 3.4, -1 - Math.random() * 3.4);
				fish.userData.velocity = new THREE.Vector3((Math.random() * 0.03 + 0.008) * (Math.random() > 0.5 ? 1 : -1), (Math.random() * 0.02 - 0.01), (Math.random() * 0.018 - 0.009));
				fishGroup.push(fish);
				scene.add(fish);
			}
		}

		function loadFishModel() {
			const mtlLoader = new THREE.MTLLoader();
			const objLoader = new THREE.OBJLoader();

			mtlLoader.setPath(fishModelPath);
			mtlLoader.load('12265_Fish_v1_L2.mtl', (materials) => {
				materials.preload();
				objLoader.setMaterials(materials);
				objLoader.setPath(fishModelPath);
				objLoader.load('12265_Fish_v1_L2.obj', (object) => {
					fishModelPrototype = object;
					fishModelPrototype.traverse((child) => {
						if (child.isMesh) {
							child.castShadow = false;
							child.receiveShadow = true;
						}
					});
					fishModelPrototype.scale.setScalar(fishModelScale);
					statusElement.innerText = '魚モデル読み込み完了。顔のトラッキングを開始します。';
					for (let i = 0; i < 9; i++) createFish();
				}, (xhr) => {}, (error) => {
					console.error('OBJロード失敗', error);
					statusElement.innerText = '魚モデルの読み込みに失敗しました。フォールバックで表示します。';
					createFallbackFish(9);
				});
			}, (xhr) => {}, (error) => {
				console.error('MTLロード失敗', error);
				statusElement.innerText = '魚マテリアルの読み込みに失敗しました。フォールバックで表示します。';
				createFallbackFish(9);
			});
		}

		loadFishModel();

		const ambientLight = new THREE.AmbientLight(0x6cc9ff, 0.8);
		scene.add(ambientLight);

		const directionalLight = new THREE.DirectionalLight(0xc8f5ff, 1.0);
		directionalLight.position.set(5, 10, 6);
		scene.add(directionalLight);

		const pointLight = new THREE.PointLight(0x90d9ff, 1.2, 30);
		pointLight.position.set(-2, 4, 6);
		scene.add(pointLight);

		camera.position.set(0, 0.2, 7.8);
		camera.lookAt(0, 0, -2);

		let targetX = 0;
		let targetY = 0;

		function resizeRenderer() {
			const size = Math.min(window.innerWidth - 40, window.innerHeight - 40, 640);
			renderer.setSize(size, size);
			camera.aspect = 1;
			camera.updateProjectionMatrix();
		}
		window.addEventListener('resize', resizeRenderer);
		resizeRenderer();

		function updateScene() {
			bubbles.forEach((bubble) => {
				bubble.mesh.position.y += bubble.speed;
				bubble.mesh.position.x += Math.sin(bubble.mesh.position.y * 1.15) * 0.001;
				if (bubble.mesh.position.y > roomSize / 2 - 0.2) {
					bubble.mesh.position.y = -roomSize / 2 + 0.2;
					bubble.mesh.position.x = (Math.random() - 0.5) * 5.4;
					bubble.mesh.position.z = (Math.random() - 0.5) * 4.6;
				}
			});

			fishGroup.forEach((fish) => {
				fish.position.add(fish.userData.velocity);
				if (fish.position.x > 4.3 || fish.position.x < -4.3) {
					fish.userData.velocity.x *= -1;
					fish.scale.x *= -1;
				}
				if (fish.position.y > 3.2 || fish.position.y < -3.2) {
					fish.userData.velocity.y *= -1;
				}
				if (fish.position.z > 4.2 || fish.position.z < -4.2) {
					fish.userData.velocity.z *= -1;
				}
				fish.rotation.y = Math.atan2(-fish.userData.velocity.z, fish.userData.velocity.x);
			});
		}

		function animate() {
			requestAnimationFrame(animate);
			updateScene();
			camera.position.x += (targetX - camera.position.x) * 0.08;
			camera.position.y += (targetY - camera.position.y) * 0.08;
			camera.lookAt(0, 0, -2);
			renderer.render(scene, camera);
		}

		function onResults(results) {
			if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
				statusElement.innerText = '顔が見つかりません。カメラに正面を向いてください。';
				return;
			}

			statusElement.innerText = 'トラッキング中です。左右上下に顔を動かして箱の中をのぞいてみてください。';
			const landmarks = results.multiFaceLandmarks[0];
			const leftEye = landmarks[33];
			const rightEye = landmarks[263];

			const eyeX = (leftEye.x + rightEye.x) / 2;
			const eyeY = (leftEye.y + rightEye.y) / 2;

			targetX = (0.5 - eyeX) * 3.2;
			targetY = (eyeY - 0.5) * 2.5;
		}

		const faceMesh = new FaceMesh({
			locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
		});

		faceMesh.setOptions({
			maxNumFaces: 1,
			refineLandmarks: false,
			minDetectionConfidence: 0.6,
			minTrackingConfidence: 0.6,
		});
		faceMesh.onResults(onResults);

		const cameraUtils = new Camera(videoElement, {
			onFrame: async () => {
				await faceMesh.send({ image: videoElement });
			},
			width: 640,
			height: 480,
		});

		cameraUtils.start()
			.then(() => {
				statusElement.innerText = 'カメラ準備完了。顔を読み込んでいます...';
			})
			.catch((err) => {
				statusElement.innerText = 'カメラの起動に失敗しました: ' + err;
			});

		animate();
	</script>
</body>

</html>
