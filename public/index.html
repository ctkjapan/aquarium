<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aquarium</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c3336;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        #aquarium-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 101;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px) saturate(120%);
            -webkit-backdrop-filter: blur(12px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 20px;
            width: 250px;
            z-index: 100;
            box-shadow: 0 8px 32px 0 rgba(0, 30, 35, 0.3);
            color: #ffffff;
            user-select: none;
            transition: opacity 0.3s ease, transform 0.3s ease, pointer-events 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }

        .control-panel.hidden {
            opacity: 0;
            transform: translateX(-30px);
            pointer-events: none;
        }

        .control-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .control-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .checkbox-group {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 12px;
            margin-top: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #3cd3bf;
        }
    </style>
</head>

<body>

    <button class="toggle-btn" id="btn-toggle-panel">🛠️ パネル閉じる</button>

    <div class="control-panel" id="panel-menu">
        <h3>⚙️ Aquarium Settings</h3>
        <div class="control-group">
            <label><span>🐟 魚の数</span><span id="fish-count-val">25</span></label>
            <input type="range" id="slider-fish" min="0" max="1000" value="25">
        </div>
        <div class="control-group">
            <label><span>🫙 水槽の数（演出強度）</span><span id="tank-count-val">10</span></label>
            <input type="range" id="slider-tank" min="1" max="1000" value="10">
        </div>
        <div class="control-group">
            <label><span>🌿 水草の数</span><span id="seaweed-count-val">4</span></label>
            <input type="range" id="slider-seaweed" min="0" max="1000" value="4">
        </div>
        <div class="control-group">
            <label><span>✨ キラキラ頻度 (MAX 100倍)</span><span id="sparkle-val">50</span></label>
            <input type="range" id="slider-sparkle" min="0" max="1000" value="50">
        </div>
        <div class="control-group">
            <label><span>🫧 泡の量頻度 (MAX 100倍)</span><span id="bubble-val">50</span></label>
            <input type="range" id="slider-bubble" min="0" max="1000" value="50">
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="check-caustics" checked> 🌊 水底の光の波紋
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="check-godrays" checked> ☀️ 強力なゴッドレイ
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="check-bloom" checked> 💡 全体発光ブルーム
            </label>
        </div>
    </div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');

        const fishEmojis = ['🐠', '🐡', '🐟', '🐢', '🦐', '🐬', '🦈', '🪼', '🐙', '🦑', '🦀', '🐚'];

        let fishes = [];
        let seaweeds = [];
        let bubbles = [];
        let sparkles = [];

        const emojiCache = {};
        function preRenderEmojis() {
            fishEmojis.forEach(emoji => {
                emojiCache[emoji] = [];
                [0.65, 1.0, 1.45].forEach((multiplier, depth) => {
                    const size = Math.floor(60 * multiplier);
                    const offscreenCanvas = document.createElement('canvas');
                    offscreenCanvas.width = size * 2;
                    offscreenCanvas.height = size * 2;
                    const oCtx = offscreenCanvas.getContext('2d');
                    oCtx.font = `${size}px sans-serif`;
                    oCtx.textBaseline = 'middle';
                    oCtx.textAlign = 'center';
                    if (depth === 0) oCtx.globalAlpha = 0.5;
                    oCtx.fillText(emoji, size, size);
                    emojiCache[emoji][depth] = offscreenCanvas;
                });
            });
        }
        preRenderEmojis();

        const sliderFish = document.getElementById('slider-fish');
        const sliderTank = document.getElementById('slider-tank');
        const sliderSeaweed = document.getElementById('slider-seaweed');
        const sliderSparkle = document.getElementById('slider-sparkle');
        const sliderBubble = document.getElementById('slider-bubble');

        const fishCountVal = document.getElementById('fish-count-val');
        const tankCountVal = document.getElementById('tank-count-val');
        const seaweedCountVal = document.getElementById('seaweed-count-val');
        const sparkleVal = document.getElementById('sparkle-val');
        const bubbleVal = document.getElementById('bubble-val');

        const checkCaustics = document.getElementById('check-caustics');
        const checkGodrays = document.getElementById('check-godrays');
        const checkBloom = document.getElementById('check-bloom');
        const btnTogglePanel = document.getElementById('btn-toggle-panel');
        const panelMenu = document.getElementById('panel-menu');

        btnTogglePanel.addEventListener('click', () => {
            const isHidden = panelMenu.classList.toggle('hidden');
            btnTogglePanel.innerText = isHidden ? '🛠️ パネル開く' : '🛠️ パネル閉じる';
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFish() {
            const type = fishEmojis[Math.floor(Math.random() * fishEmojis.length)];
            const depth = Math.floor(Math.random() * 3);
            let minSize = 25, maxSize = 45;
            if (type === '🦈' || type === '🐬') { minSize = 65; maxSize = 95; }
            else if (type === '🐢' || type === '🪼') { minSize = 50; maxSize = 70; }
            else if (type === '🦐' || type === '🦀' || type === '🐚') { minSize = 20; maxSize = 30; }

            const sizeMultiplier = [0.65, 1.0, 1.45][depth];
            const size = (Math.random() * (maxSize - minSize) + minSize) * sizeMultiplier;

            let x = Math.random() * window.innerWidth;
            let y = (type === '🦀' || type === '🐙' || type === '🐚')
                ? window.innerHeight - size - 20 - (Math.random() * 30)
                : Math.random() * (window.innerHeight - size - 140) + 40;

            const depthFactor = [0.5, 1.0, 1.5][depth];

            let maxSpeed = 2.0 * depthFactor;
            let friction = 0.98;

            if (type === '🦈' || type === '🐬') maxSpeed = 3.2 * depthFactor;
            if (type === '🐢') maxSpeed = 0.6 * depthFactor;
            if (type === '🪼') maxSpeed = 0.4 * depthFactor;
            if (type === '🦀' || type === '🐚') maxSpeed = 0.4 * depthFactor;

            let angle = Math.random() * Math.PI * 2;
            if (type === '🦀' || type === '🐚') angle = Math.random() > 0.5 ? 0 : Math.PI;

            return {
                type, depth, size, x, y, friction, maxSpeed,
                vx: Math.cos(angle) * (maxSpeed * 0.5),
                vy: Math.sin(angle) * (maxSpeed * 0.5),
                currentAngle: angle,
                targetAngle: angle,
                aiTimer: Math.random() * 100,
                swimCycle: Math.random() * Math.PI * 2,
                pulseTimer: Math.random() * 60,
                pulseInterval: Math.random() * 60 + 40
            };
        }

        function createSeaweed() {
            return {
                depth: Math.random() > 0.5 ? 0 : 2,
                width: Math.random() * 10 + 18,
                height: Math.random() * 140 + 170,
                leftPos: Math.random() > 0.5 ? (Math.random() * 25) : (Math.random() * 25 + 70),
                delay: Math.random() * 100
            };
        }

        function createBubbleData() {
            const depth = Math.floor(Math.random() * 3);
            const baseSize = Math.random() * 6 + 3;
            const sizeMultiplier = [0.6, 1.1, 1.8][depth];
            const size = baseSize * sizeMultiplier;

            return {
                x: Math.random() * window.innerWidth,
                y: window.innerHeight + size + 10,
                depth: depth,
                size: size,
                speedY: (Math.random() * 1.2 + 1.0) * [0.7, 1.1, 1.7][depth],
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: Math.random() * 0.04 + 0.02,
                wobbleWeight: Math.random() * 0.8 + 0.4
            };
        }

        function createSparkleData() {
            return {
                x: Math.random() * window.innerWidth,
                y: Math.random() * (window.innerHeight * 0.8),
                size: Math.random() * 40 + 25,
                alpha: 1,
                fade: Math.random() * 0.015 + 0.005,
                isStar: Math.random() > 0.55,
                color: ['#ffffff', '#fff066', '#ff99cc', '#66ffff'][Math.floor(Math.random() * 4)],
                shape: Math.random() > 0.5 ? '✦' : '✧'
            };
        }

        let step = 0;

        function updateAndDraw() {
            step += 0.05;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#7ef2eb');
            bgGrad.addColorStop(0.35, '#3cd3bf');
            bgGrad.addColorStop(0.7, '#189e8b');
            bgGrad.addColorStop(1, '#0c615b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const targetFish = parseInt(sliderFish.value); fishCountVal.innerText = targetFish;
            while (fishes.length < targetFish) fishes.push(createFish());
            while (fishes.length > targetFish) fishes.pop();

            const targetSeaweed = parseInt(sliderSeaweed.value); seaweedCountVal.innerText = targetSeaweed;
            while (seaweeds.length < targetSeaweed) seaweeds.push(createSeaweed());
            while (seaweeds.length > targetSeaweed) seaweeds.pop();

            const bubbleLevel = parseInt(sliderBubble.value); bubbleVal.innerText = bubbleLevel;
            if (bubbleLevel > 0) {
                const spawnChance = (bubbleLevel / 1000) * 4;
                for (let i = 0; i < Math.floor(spawnChance); i++) bubbles.push(createBubbleData());
                if (Math.random() < (spawnChance % 1)) bubbles.push(createBubbleData());
            }

            const sparkleLevel = parseInt(sliderSparkle.value); sparkleVal.innerText = sparkleLevel;
            if (sparkleLevel > 0) {
                const spawnChance = (sparkleLevel / 1000) * 3;
                for (let i = 0; i < Math.floor(spawnChance); i++) sparkles.push(createSparkleData());
                if (Math.random() < (spawnChance % 1)) sparkles.push(createSparkleData());
            }

            const tankCount = parseInt(sliderTank.value); tankCountVal.innerText = tankCount;

            for (let layer = 0; layer < 3; layer++) {

                // 水草
                seaweeds.forEach(sw => {
                    if (sw.depth !== layer) return;
                    ctx.save();
                    let xPos = (sw.leftPos / 100) * canvas.width;
                    ctx.translate(xPos, canvas.height - 15);
                    let waveAngle = Math.sin(step * 0.4 + sw.delay) * 0.08;
                    ctx.transform(1, 0, Math.tan(waveAngle), 1, 0, 0);

                    let swGrad = ctx.createLinearGradient(0, 0, 0, -sw.height);
                    if (layer === 0) {
                        swGrad.addColorStop(0, '#1b6340'); swGrad.addColorStop(1, '#3ca36f');
                        ctx.globalAlpha = 0.6;
                    } else {
                        swGrad.addColorStop(0, '#329e61'); swGrad.addColorStop(1, '#9bf59b');
                        ctx.globalAlpha = 0.9;
                    }
                    ctx.fillStyle = swGrad;
                    ctx.beginPath();
                    ctx.moveTo(-sw.width / 2, 0);
                    ctx.quadraticCurveTo(-sw.width / 2, -sw.height / 2, 0, -sw.height);
                    ctx.quadraticCurveTo(sw.width / 2, -sw.height / 2, sw.width / 2, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                });

                // 魚
                fishes.forEach(fish => {
                    if (fish.depth !== layer) return;

                    fish.aiTimer--;
                    fish.pulseTimer--;

                    if (fish.aiTimer <= 0) {
                        fish.aiTimer = Math.random() * 150 + 100;
                        if (fish.type !== '🦀' && fish.type !== '🐚') {
                            fish.targetAngle = fish.currentAngle + (Math.random() - 0.5) * (Math.PI * 0.5);
                            if (fish.y < 80) fish.targetAngle = Math.random() * Math.PI * 0.4 + 0.1;
                            if (fish.y > canvas.height - 160) fish.targetAngle = -Math.random() * Math.PI * 0.4 - 0.1;
                        } else {
                            fish.targetAngle = Math.random() > 0.4 ? (Math.random() > 0.5 ? 0 : Math.PI) : -1;
                        }
                    }

                    if (fish.pulseTimer <= 0) {
                        fish.pulseTimer = fish.pulseInterval + Math.random() * 30;
                        if (fish.type !== '🦀' && fish.type !== '🐚' && fish.targetAngle !== -1) {
                            let force = fish.maxSpeed * (Math.random() * 0.6 + 0.6);
                            if (fish.type === '🪼') force *= 1.8;
                            fish.vx += Math.cos(fish.currentAngle) * force;
                            fish.vy += Math.sin(fish.currentAngle) * force;
                        } else if (fish.targetAngle !== -1) {
                            fish.vx = Math.cos(fish.targetAngle) * fish.maxSpeed;
                        } else {
                            fish.vx = 0;
                        }
                    }

                    if (fish.type === '🪼') {
                        fish.swimCycle += 0.05;
                        fish.vy += Math.sin(fish.swimCycle) * 0.03;
                        fish.friction = 0.96;
                    }

                    let angleSpeed = 0.04;
                    if (fish.type === '🐢') angleSpeed = 0.015;
                    if (fish.type === '🦈' || fish.type === '🐬') angleSpeed = 0.06;

                    let angleDiff = fish.targetAngle - fish.currentAngle;
                    fish.currentAngle += angleDiff * angleSpeed;

                    fish.vx *= fish.friction;
                    fish.vy *= fish.friction;
                    fish.x += fish.vx;
                    fish.y += fish.vy;

                    if (fish.x < -fish.size * 1.5) fish.x = canvas.width;
                    else if (fish.x > canvas.width + fish.size * 1.5) fish.x = -fish.size;

                    let minY = 35, maxY = canvas.height - fish.size - 35;
                    if (fish.type === '🦀' || fish.type === '🐙' || fish.type === '🐚') {
                        minY = canvas.height - fish.size - 60;
                        fish.vy = 0;
                        if (fish.y < minY || fish.y > maxY) fish.y = maxY - 5;
                    } else {
                        if (fish.y < minY) { fish.y = minY; fish.vy *= -0.5; fish.targetAngle = Math.PI * 0.3; }
                        if (fish.y > maxY) { fish.y = maxY; fish.vy *= -0.5; fish.targetAngle = -Math.PI * 0.3; }
                    }

                    // ─── ★進行方向（移動ベクトル）への同期修正箇所 ───
                    // 実際の移動速度ベクトル（vx, vy）から移動中の角度を正しく算出
                    let movementAngle = Math.atan2(fish.vy, fish.vx);

                    // 初期の絵文字の向きの定義 (元々左を向いている絵文字グループ)
                    const defaultLeftFacing = ['🐢', '🐬', '🦈', '🪼', '🦑', '🐙', '🦀'].includes(fish.type);

                    let flip = 1;
                    let rotateAngle = 0;

                    // 速度が一定以上出ている場合のみ角度を同期（静止バグを防ぐ）
                    if (Math.abs(fish.vx) > 0.05 || Math.abs(fish.vy) > 0.05) {
                        if (fish.vx > 0) {
                            // 右へ移動中
                            flip = defaultLeftFacing ? -1 : 1;
                            // Canvasの反転(scaleX=-1)を入れると座標軸が鏡像になるため、回転角度の正負を調整
                            rotateAngle = defaultLeftFacing ? -movementAngle : movementAngle;
                        } else {
                            // 左へ移動中
                            flip = defaultLeftFacing ? 1 : -1;
                            // 左移動で右向き絵文字を反転させた場合も同様に処理
                            rotateAngle = defaultLeftFacing ? (movementAngle + Math.PI) : -(movementAngle + Math.PI);
                        }
                    } else {
                        // ほぼ静止している場合（主にカニや貝）
                        flip = 1;
                        rotateAngle = 0;
                    }

                    // クラゲやタコなど、進行方向へ激しく傾けたくない生物用のフィルター
                    if (fish.type === '🪼' || fish.type === '🐙') {
                        rotateAngle *= 0.15;
                    }

                    ctx.save();
                    ctx.translate(fish.x + fish.size / 2, fish.y + fish.size / 2);
                    ctx.scale(flip, 1);
                    ctx.rotate(rotateAngle);

                    const cachedImg = emojiCache[fish.type][fish.depth];
                    if (cachedImg) {
                        ctx.drawImage(cachedImg, -fish.size, -fish.size, fish.size * 2, fish.size * 2);
                    }
                    ctx.restore();
                });

                // 泡
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];
                    if (b.depth !== layer) continue;

                    b.y -= b.speedY;
                    b.wobble += b.wobbleSpeed;
                    b.x += Math.sin(b.wobble) * b.wobbleWeight + Math.cos(b.wobble * 0.5) * 0.2;

                    ctx.save();
                    ctx.globalAlpha = [0.4, 0.75, 0.95][b.depth];

                    let bubbleGrad = ctx.createRadialGradient(
                        b.x - b.size * 0.2, b.y - b.size * 0.2, b.size * 0.1,
                        b.x, b.y, b.size
                    );
                    bubbleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
                    bubbleGrad.addColorStop(0.7, 'rgba(230, 250, 255, 0.4)');
                    bubbleGrad.addColorStop(0.95, 'rgba(255, 255, 255, 0.85)');
                    bubbleGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fillStyle = bubbleGrad;
                    ctx.fill();

                    if (b.size > 3) {
                        ctx.beginPath();
                        ctx.arc(b.x - b.size * 0.35, b.y - b.size * 0.35, b.size * 0.15, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        ctx.fill();
                    }
                    ctx.restore();

                    if (b.y < -b.size * 2) bubbles.splice(i, 1);
                }

                if (layer === 0 && checkCaustics.checked) {
                    ctx.save();
                    ctx.mixBlendMode = 'overlay';
                    ctx.globalAlpha = 0.07;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.restore();
                }

                if (layer === 1 && checkGodrays.checked) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'overlay';
                    let intensity = Math.min(0.2 + (tankCount / 1000) * 0.6, 0.85);
                    ctx.globalAlpha = intensity;

                    let rayGrad = ctx.createLinearGradient(canvas.width * 0.3, 0, canvas.width * 0.6, canvas.height);
                    rayGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
                    rayGrad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
                    rayGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = rayGrad;

                    ctx.beginPath();
                    let timeShift = Math.sin(step * 0.1) * 40;
                    ctx.moveTo(canvas.width * 0.2 + timeShift, 0);
                    ctx.lineTo(canvas.width * 0.5 + timeShift, canvas.height);
                    ctx.lineTo(canvas.width * 0.7 + timeShift, canvas.height);
                    ctx.lineTo(canvas.width * 0.4 + timeShift, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            }

            // キラキラ
            sparkles.forEach((s, idx) => {
                s.alpha -= s.fade;
                s.y -= 0.2;
                if (s.alpha <= 0) {
                    sparkles.splice(idx, 1);
                    return;
                }
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = s.color;
                if (s.isStar) {
                    ctx.font = `${s.size}px sans-serif`;
                    ctx.fillText(s.shape, s.x, s.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // 砂浜
            let sandGrad = ctx.createLinearGradient(0, canvas.height - 20, 0, canvas.height);
            sandGrad.addColorStop(0, '#eddca2');
            sandGrad.addColorStop(1, '#fff1cc');
            ctx.fillStyle = sandGrad;
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // ブルーム
            if (checkBloom.checked) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                let bloomGrad = ctx.createRadialGradient(canvas.width / 2, 0, 10, canvas.width / 2, 0, canvas.height * 0.8);
                bloomGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
                bloomGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = bloomGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            requestAnimationFrame(updateAndDraw);
        }

        requestAnimationFrame(updateAndDraw);
    </script>

</body>

</html>
