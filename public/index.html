<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aquarium</title>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>

<body>
    <canvas id="aquarium-canvas"></canvas>

    <button class="toggle-btn" id="btn-toggle-panel">🛠️</button>

    <div class="control-panel hidden" id="panel-menu">
        <h3>⚙️ Aquarium Settings</h3>
        <div>
            <h4>オブジェクト数</h4>
            <div class="control-group">
                <label><span>🐟 魚の数</span><span id="fish-count-val">25</span></label>
                <input type="range" id="slider-fish" min="0" max="1000" value="25">
            </div>
            <div class="control-group">
                <label><span>🌿 水草の数</span><span id="seaweed-count-val">4</span></label>
                <input type="range" id="slider-seaweed" min="0" max="1000" value="4">
            </div>
            <div class="control-group">
                <label><span>✨ キラキラの数</span><span id="sparkle-val">50</span></label>
                <input type="range" id="slider-sparkle" min="0" max="1000" value="50">
            </div>
            <div class="control-group">
                <label><span>🫧 泡の数</span><span id="bubble-val">50</span></label>
                <input type="range" id="slider-bubble" min="0" max="1000" value="50">
            </div>
            <div class="control-group">
                <label><span>🫙 演出強度</span><span id="tank-count-val">10</span></label>
                <input type="range" id="slider-tank" min="1" max="1000" value="10">
            </div>
        </div>
        <div class="checkbox-group">
            <h4>演出効果</h4>
            <label class="checkbox-label">
                <input type="checkbox" id="check-caustics" checked> 🌊 水底の光の波紋
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="check-godrays" checked> ☀️ 強力なゴッドレイ
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="check-bloom" checked> 💡 全体発光ブルーム
            </label>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>

</html>
