<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Eye Tracking 3D Box Demo</title>

	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #050505;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
			font-family: sans-serif;
		}

		/* 3Dを描画するキャンバス（箱の窓） */
		#canvas-container {
			position: relative;
			width: 500px;
			height: 500px;
			border: 6px solid #333;
			border-radius: 20px;
			overflow: hidden;
			box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
		}

		canvas {
			width: 100%;
			height: 100%;
		}

		/* サブのWebcam映像（左上に配置） */
		#webcam {
			position: absolute;
			top: 15px;
			left: 15px;
			width: 100px;
			height: 75px;
			border-radius: 6px;
			transform: scaleX(-1);
			/* 鏡表示 */
			border: 2px solid #555;
			background: #000;
			z-index: 10;
		}

		#status {
			position: absolute;
			bottom: 25px;
			color: #888;
			font-size: 14px;
			background: rgba(0, 0, 0, 0.6);
			padding: 8px 16px;
			border-radius: 20px;
			pointer-events: none;
		}
	</style>
</head>

<body>

	<video id="webcam" autoplay playsinline></video>

	<div id="canvas-container">
	</div>

	<div id="status">カメラの起動を待っています...</div>

	<script>
		const videoElement = document.getElementById('webcam');
		const statusElement = document.getElementById('status');
		const container = document.getElementById('canvas-container');

		// --- 1. Three.js の初期設定 (箱の中の世界を作る) ---
		const scene = new THREE.Scene();

		// 画角（FOV）は少し狭めにして覗き込み感を強調
		const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(500, 500);
		container.appendChild(renderer.domElement);

		// 大きな逆インサイドボックス（箱の「内側」を描画する部屋）を作成
		const roomSize = 10;
		const roomGeo = new THREE.BoxGeometry(roomSize, roomSize, roomSize);

		// 部屋の内壁用マテリアル（格子模様のテクスチャを簡易的にシミュレート）
		// 内側を描画するために side: THREE.BackSide を指定
		const roomMaterials = [
			new THREE.MeshPhongMaterial({ color: 0x111122, side: THREE.BackSide }), // 右
			new THREE.MeshPhongMaterial({ color: 0x111122, side: THREE.BackSide }), // 左
			new THREE.MeshPhongMaterial({ color: 0x223322, side: THREE.BackSide }), // 天井
			new THREE.MeshPhongMaterial({ color: 0x222233, side: THREE.BackSide }), // 床
			new THREE.MeshPhongMaterial({ color: 0x151515, side: THREE.BackSide }), // 奥
			new THREE.MeshPhongMaterial({ color: 0x000000, side: THREE.BackSide })  // 手前（見えない）
		];
		const room = new THREE.Mesh(roomGeo, roomMaterials);
		scene.add(room);

		// 部屋の四隅にワイヤーフレームを置いて奥行きをわかりやすくする
		const wireframe = new THREE.BoxHelper(room, 0xffffff);
		scene.add(wireframe);

		// 箱の中に浮かぶオブジェクト（手前・中間・奥）
		const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
		const material = new THREE.MeshNormalMaterial(); // 面ごとに色が変わるマテリアル
		const centerCube = new THREE.Mesh(geometry, material);
		centerCube.position.set(0, 0, -1); // やや奥に配置
		scene.add(centerCube);

		// 奥に配置する小さな球体たち
		const sphereGeo = new THREE.SphereGeometry(0.4, 32, 32);
		const sphereMat = new THREE.MeshPhongMaterial({ color: 0x00ffcc, emissive: 0x003322 });
		for (let i = 0; i < 5; i++) {
			const sphere = new THREE.Mesh(sphereGeo, sphereMat);
			sphere.position.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, -4);
			scene.add(sphere);
		}

		// 照明の追加
		const light = new THREE.DirectionalLight(0xffffff, 1);
		light.position.set(5, 5, 5);
		scene.add(light);
		const ambientLight = new THREE.AmbientLight(0x404040);
		scene.add(ambientLight);

		// 初期カメラ位置（箱の手前中央）
		const defaultZ = 7;
		camera.position.set(0, 0, defaultZ);
		camera.lookAt(0, 0, -2);

		// 目標とするカメラ位置（スムージング用）
		let targetX = 0;
		let targetY = 0;


		// --- 2. MediaPipe による視点トラッキング ---
		function onResults(results) {
			if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
				return;
			}
			statusElement.innerText = "トラッキング中（左右上下にのぞき込んでみてください）";

			const landmarks = results.multiFaceLandmarks[0];

			// 両目のランドマーク（33:左目端、263:右目端）の中心を算出
			const leftEye = landmarks[33];
			const rightEye = landmarks[263];
			const eyeX = (leftEye.x + rightEye.x) / 2;
			const eyeY = (leftEye.y + rightEye.y) / 2;

			// 基準を画面中央（0, 0）にし、-3.5 から +3.5 の範囲でカメラを動かすように変換
			// カメラ反転を考慮してX軸を調整
			targetX = (0.5 - eyeX) * 7.0;
			targetY = (0.5 - eyeY) * 7.0;
		}

		const faceMesh = new FaceMesh({
			locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
		});

		faceMesh.setOptions({
			maxNumFaces: 1,
			refineLandmarks: false,
			minDetectionConfidence: 0.6,
			minTrackingConfidence: 0.6
		});
		faceMesh.onResults(onResults);

		const cameraUtils = new Camera(videoElement, {
			onFrame: async () => {
				await faceMesh.send({ image: videoElement });
			},
			width: 640,
			height: 480
		});
		cameraUtils.start().then(() => {
			statusElement.innerText = "顔を探しています...";
		});


		// --- 3. アニメーションループ (描画更新) ---
		function animate() {
			requestAnimationFrame(animate);

			// イージング（線形補間）を使ってカメラの動きをなめらかにする（カクつき防止）
			camera.position.x += (targetX - camera.position.x) * 0.1;
			camera.position.y += (targetY - camera.position.y) * 0.1;

			// 常に箱の「奥（注視点）」を向くように設定
			camera.lookAt(0, 0, -2);

			// 中央の立方体を少し回転させて動的な表現に
			centerCube.rotation.x += 0.005;
			centerCube.rotation.y += 0.01;

			renderer.render(scene, camera);
		}

		animate();
	</script>
</body>

</html>
