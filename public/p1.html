<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Eye Tracking Pseudo-3D Demo</title>

	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #1a1a1a;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
			font-family: sans-serif;
		}

		/* 疑似3Dを表示するステージ */
		#stage {
			position: relative;
			width: 400px;
			height: 400px;
			background: radial-gradient(circle, #333 0%, #111 100%);
			border: 4px solid #fff;
			border-radius: 16px;
			overflow: hidden;
			perspective: 1000px;
			/* 3D効果に必須 */
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
		}

		/* 背景レイヤー（奥） */
		.layer-bg {
			position: absolute;
			width: 120%;
			height: 120%;
			top: -10%;
			left: -10%;
			background-image: linear-gradient(rgba(255, 255, 255, 0.1) 2px, transparent 2px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.1) 2px, transparent 2px);
			background-size: 40px 40px;
			background-position: center;
			transition: transform 0.1s ease-out;
		}

		/* 中景レイヤー（文字など） */
		.layer-text {
			position: absolute;
			width: 100%;
			text-align: center;
			top: 45%;
			color: rgba(255, 255, 255, 0.2);
			font-size: 3rem;
			font-weight: bold;
			letter-spacing: 5px;
			pointer-events: none;
			transition: transform 0.08s ease-out;
		}

		/* 手前のオブジェクト（手前） */
		.layer-fg {
			position: absolute;
			width: 100px;
			height: 100px;
			background: linear-gradient(135deg, #ff007f, #7f00ff);
			top: 150px;
			left: 150px;
			border-radius: 20px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			transition: transform 0.05s ease-out;
		}

		/* デバッグ用のカメラ映像（左上に小さく表示） */
		#webcam {
			position: absolute;
			top: 10px;
			left: 10px;
			width: 120px;
			height: 90px;
			border-radius: 8px;
			transform: scaleX(-1);
			/* 鏡画像にする */
			border: 2px solid #555;
			background: #000;
		}

		#status {
			position: absolute;
			bottom: 20px;
			color: #aaa;
			font-size: 12px;
		}
	</style>
</head>

<body>

	<video id="webcam" autoplay playsinline></video>

	<div id="stage">
		<div class="layer-bg" id="bg"></div>
		<div class="layer-text" id="md">PSEUDO 3D</div>
		<div class="layer-fg" id="fg"></div>
	</div>

	<div id="status">カメラを許可して、顔を画面に向けてください...</div>

	<script>
		const videoElement = document.getElementById('webcam');
		const statusElement = document.getElementById('status');

		// 動かす各レイヤーの要素
		const elBg = document.getElementById('bg');
		const elMd = document.getElementById('md');
		const elFg = document.getElementById('fg');

		// 顔認識データが処理されたときのコールバック
		function onResults(results) {
			if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
				return;
			}

			statusElement.innerText = "トラッキング中...";

			// 最初の顔のランドマークを取得
			const landmarks = results.multiFaceLandmarks[0];

			// MediaPipe Face Mesh のインデックス:
			// 33: 左目（向かって右）の外側, 263: 右目（向かって左）の外側
			// もしくは、シンプルに鼻の頭（1番）や全体の中心でも代用可能。ここでは両目の中心を計算
			const leftEye = landmarks[33];
			const rightEye = landmarks[263];

			// 両目の中心座標（0.0 〜 1.0）
			const eyeX = (leftEye.x + rightEye.x) / 2;
			const eyeY = (leftEye.y + rightEye.y) / 2;

			// 中心を 0 としたとき、 -0.5 〜 +0.5 の範囲に変換
			// カメラが鏡映し（インバース）になるのを考慮してX軸を反転
			const offsetX = (0.5 - eyeX);
			const offsetY = (eyeY - 0.5);

			// 各レイヤーの移動量を調整（パララックス効果）
			// 手前にあるものほど、目の動き（顔の傾き）に対して大きく、かつ逆に動く

			// 1. 背景（奥）：目の動きと同じ方向に少しだけ動く
			const bgMoveX = offsetX * 40;
			const bgMoveY = offsetY * 40;
			elBg.style.transform = `translate(${bgMoveX}px, ${bgMoveY}px)`;

			// 2. 中景（文字）：中程度の動き
			const mdMoveX = offsetX * -30;
			const mdMoveY = offsetY * -30;
			elMd.style.transform = `translate(${mdMoveX}px, ${mdMoveY}px)`;

			// 3. 手前のボックス：大きく動かし、かつ若干の3D回転を加える
			const fgMoveX = offsetX * -120;
			const fgMoveY = offsetY * -120;
			const rotateY = offsetX * 45; // 覗き込んだときに見える角度
			const rotateX = offsetY * -45;
			elFg.style.transform = `translate(${fgMoveX}px, ${fgMoveY}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
		}

		// MediaPipe FaceMesh の初期設定
		const faceMesh = new FaceMesh({
			locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
		});

		faceMesh.setOptions({
			maxNumFaces: 1,
			refineLandmarks: false, // 目の詳細をとる場合はtrueにするが、今回は軽量化のためfalse
			minDetectionConfidence: 0.5,
			minTrackingConfidence: 0.5
		});

		faceMesh.onResults(onResults);

		// カメラの起動
		const camera = new Camera(videoElement, {
			onFrame: async () => {
				await faceMesh.send({ image: videoElement });
			},
			width: 640,
			height: 480
		});

		camera.start()
			.then(() => {
				statusElement.innerText = "カメラ準備完了。顔を読み込んでいます...";
			})
			.catch(err => {
				statusElement.innerText = "カメラの起動に失敗しました: " + err;
			});
	</script>
</body>

</html>
